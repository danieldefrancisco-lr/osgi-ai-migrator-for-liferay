name: Build update site

# main and pull requests only build; pushing a v* tag (e.g. v2.0.0) also publishes the update site
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UPDATE_SITE: releng/io.github.danieldefrancisco_lr.migrator.updatesite/target/repository
  RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') && !github.event.repository.private }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Avoid publishing a tag that does not match the version being built
      - name: Check tag matches plugin and feature versions
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          bundle=$(sed -n 's/^Bundle-Version: *\([0-9.]*\)\.qualifier.*/\1/p' bundles/io.github.danieldefrancisco_lr.migrator/META-INF/MANIFEST.MF)
          feature=$(sed -n 's/^ *version="\([0-9.]*\)\.qualifier".*/\1/p' features/io.github.danieldefrancisco_lr.migrator.feature/feature.xml)
          echo "tag=$tag bundle=$bundle feature=$feature"
          if [ "$tag" != "$bundle" ] || [ "$tag" != "$feature" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Bundle-Version $bundle / feature version $feature"
            exit 1
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # The characterization tests open SWT message dialogs, so they need a virtual display
      - name: Build and test with Tycho
        run: |
          set -o pipefail
          ./mvnw -v
          xvfb-run -a ./mvnw -B clean install 2>&1 | tee build.log

      # Caches Gradle and the IntelliJ Platform the plugin compiles against
      - uses: gradle/actions/setup-gradle@v4

      # Uses the core jar that the Maven build installed in the local repository
      - name: Build IntelliJ plugin
        working-directory: intellij
        run: |
          set -o pipefail
          ./gradlew --no-daemon buildPlugin 2>&1 | tee -a ../build.log

      # Downloads several IDE releases, so it runs for releases and manual runs only
      - name: Verify IntelliJ plugin compatibility
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        working-directory: intellij
        run: |
          set -o pipefail
          ./gradlew --no-daemon verifyPlugin 2>&1 | tee -a ../build.log

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: vscode/package-lock.json

      # Bundles the CLI jar built by Maven; the version follows the pom like every other product
      - name: Build VS Code extension
        working-directory: vscode
        run: |
          set -o pipefail
          version=$(sed -n 's#^    <version>\(.*\)</version>#\1#p' ../pom.xml | head -1)
          npm version "${version%-SNAPSHOT}" --no-git-tag-version --allow-same-version
          npm ci
          npm test 2>&1 | tee -a ../build.log
          npm run package 2>&1 | tee -a ../build.log

      # Job logs need a signed-in user; annotations are visible to anyone
      - name: Report build errors as annotations
        if: failure()
        run: |
          grep -E '^\[ERROR\]|^e: |error:|What went wrong|^> ' build.log | grep -v '^\[ERROR\] *$' | head -40 | sed 's/^/::error::/'

      - name: Upload golden mismatches
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-actual
          path: '**/target/golden-actual/'
          if-no-files-found: ignore

      - name: Upload IntelliJ plugin
        uses: actions/upload-artifact@v4
        with:
          name: intellij-plugin
          path: intellij/build/distributions/*.zip

      - name: Upload VS Code extension
        uses: actions/upload-artifact@v4
        with:
          name: vscode-extension
          path: vscode/dist/*.vsix

      - name: Upload CLI
        uses: actions/upload-artifact@v4
        with:
          name: cli
          path: cli/target/osgi-ai-migrator-cli.jar

      - name: Add landing page
        run: cp releng/io.github.danieldefrancisco_lr.migrator.updatesite/index.html "$UPDATE_SITE/"

      - name: Upload update site (downloadable from the run)
        uses: actions/upload-artifact@v4
        with:
          name: update-site
          path: ${{ env.UPDATE_SITE }}

      - name: Upload update site for GitHub Pages
        if: env.RELEASE == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.UPDATE_SITE }}

  # GitHub Pages needs a public repository on a free plan, so publishing is skipped while it is private.
  # The github-pages environment must allow v* tags (Settings → Environments → github-pages).
  deploy:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && !github.event.repository.private
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Attaches every product to a GitHub Release for the tag
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && !github.event.repository.private
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Zip the update site
        run: |
          cd artifacts/update-site
          rm -f index.html
          zip -qr "../../osgi-ai-migrator-eclipse-update-site-${GITHUB_REF_NAME#v}.zip" .
          cp ../cli/osgi-ai-migrator-cli.jar "../../osgi-ai-migrator-cli-${GITHUB_REF_NAME#v}.jar"

      - uses: softprops/action-gh-release@v2
        with:
          name: OSGi AI Migrator for Liferay ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            osgi-ai-migrator-eclipse-update-site-*.zip
            osgi-ai-migrator-cli-*.jar
            artifacts/intellij-plugin/*.zip
            artifacts/vscode-extension/*.vsix
