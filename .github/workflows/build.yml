name: Build update site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UPDATE_SITE: releng/io.github.danieldefrancisco_lr.migrator.updatesite/target/repository

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build with Tycho
        run: |
          set -o pipefail
          mvn -B clean verify 2>&1 | tee build.log

      # Job logs need a signed-in user; annotations are visible to anyone
      - name: Report build errors as annotations
        if: failure()
        run: grep -E '^\[ERROR\]' build.log | grep -v '^\[ERROR\] *$' | head -40 | sed 's/^/::error::/'

      - name: Add landing page
        run: cp releng/io.github.danieldefrancisco_lr.migrator.updatesite/index.html "$UPDATE_SITE/"

      - name: Upload update site (downloadable from the run)
        uses: actions/upload-artifact@v4
        with:
          name: update-site
          path: ${{ env.UPDATE_SITE }}

      - name: Upload update site for GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && !github.event.repository.private
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.UPDATE_SITE }}

  # GitHub Pages needs a public repository on a free plan, so publishing is skipped while it is private
  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && !github.event.repository.private
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
